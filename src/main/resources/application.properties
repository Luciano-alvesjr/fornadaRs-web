spring.application.name=fornadars-web
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/fornada}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD}
# Apenas para desenvolvimento. Em produção, use migrations e ddl-auto=validate.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
